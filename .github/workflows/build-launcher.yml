name: Build CustomOS Launcher

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build Release APK with Gradle
        working-directory: ./launcher
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy & Prepare Artifacts
        run: |
          mkdir -p output
          cp launcher/app/build/outputs/apk/release/*.apk output/CustomOS-Launcher.apk

      - name: Upload Launcher Artifact
        uses: actions/upload-artifact@v4
        with:
          name: customos-launcher
          path: output/CustomOS-Launcher.apk
